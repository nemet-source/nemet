# Tema de marca NEMET — "Naturaleza que habita"
# Colores tomados de los logos originales (PALETA_NEMET en app.py).
# La capa visual completa vive en `tema_nemet.py` (CSS + componentes); aquí
# solo se declara el tema base que Streamlit aplica antes de inyectar el CSS.
[theme]
base = "light"
primaryColor = "#B4552D"        # barro (terracota): acentos, botones y estados activos
backgroundColor = "#F5EFE6"     # crema (muro encalado): fondo de la app
secondaryBackgroundColor = "#FBF8F3"  # crema suave: tarjetas y superficies
textColor = "#26231F"           # tinta (carbón): texto principal
font = "sans-serif"

[browser]
gatherUsageStats = false
